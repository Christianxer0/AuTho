plugins {
    alias(libs.plugins.android.application)
}

group = "com.example.test"

android {
    namespace 'com.example.test'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.test"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.activity.ktx   // change to libs.activity if this is a pure Java project

    // Firebase
    implementation libs.firebase.firestore

    // Biometric (minSdk 30 means no legacy FingerprintManagerCompat needed)
    implementation 'androidx.biometric:biometric:1.1.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.0'
    annotationProcessor 'androidx.room:room-compiler:2.6.0'

    // Encrypted SharedPreferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Tests (using version catalog — removed duplicate hard-coded versions)
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}